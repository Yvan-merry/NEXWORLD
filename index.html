<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>NEXWORLD V7.3 — Version consolidée</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
:root{
 --bg:#0F172A;--panel:#111c31;--panel2:#16233b;--line:#263653;
 --text:#f4f7fb;--muted:#94a3b8;--accent:#22d3ee;--green:#34d399;
 --amber:#fbbf24;--pink:#f472b6;--danger:#fb7185;--radius:18px
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{min-height:100vh;padding-bottom:84px}
.app{max-width:1180px;margin:auto;padding:14px}
.top{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.92);
backdrop-filter:blur(18px);padding:8px 0 12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border:1px solid #36506f;border-radius:14px;
display:grid;place-items:center;background:linear-gradient(135deg,#172b48,#0b1325);
font-weight:900;color:var(--accent);box-shadow:0 0 24px rgba(34,211,238,.12)}
.brand h1{font-size:20px;margin:0}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.status{margin-left:auto;font-size:11px;color:var(--muted)}

.hero{margin:14px 0;background:linear-gradient(135deg,rgba(34,211,238,.09),rgba(244,114,182,.05));
border:1px solid var(--line);border-radius:24px;padding:18px}
.hero h2{margin:0 0 6px;font-size:25px}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{font-size:21px;display:block}
.stat span{color:var(--muted);font-size:11px}

.search{width:100%;background:var(--panel);border:1px solid var(--line);
color:var(--text);border-radius:14px;padding:12px 14px;outline:none}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
padding:8px 12px;font-size:12px;white-space:nowrap;cursor:pointer;color:var(--text)}
.chip.active{border-color:var(--accent);color:var(--accent);
box-shadow:0 0 18px rgba(34,211,238,.09)}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);
border-radius:18px;overflow:hidden;cursor:pointer;min-width:0}
.poster{aspect-ratio:16/9;background:#0b1220;display:grid;place-items:center;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover}
.cardbody{padding:10px}
.title{font-weight:750;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.fav{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;
background:rgba(15,23,42,.82);border:1px solid #33445f;cursor:pointer;color:white}
.fav.on{color:var(--amber)}
.empty{border:1px dashed var(--line);border-radius:18px;padding:24px;
text-align:center;color:var(--muted);grid-column:1/-1}

.country-wrap{margin:0 0 12px}
.country-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;
text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);
border-radius:14px;padding:12px 14px;cursor:pointer}
.country-toggle.active{border-color:var(--accent);color:var(--accent)}
.country-toggle span:last-child{font-size:14px;transition:.2s}
.country-toggle.open span:last-child{transform:rotate(180deg)}
.country-panel{display:none;margin-top:8px;padding:10px;background:var(--panel);
border:1px solid var(--line);border-radius:16px;max-height:310px;overflow:auto}
.country-panel.open{display:block}
.country-search{width:100%;background:#0b1325;color:var(--text);
border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;outline:none}
.country-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.country-option{width:100%;text-align:left;background:#0b1325;color:var(--text);
border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;font-size:12px}
.country-option:hover,.country-option.active{border-color:var(--accent);
color:var(--accent);background:rgba(34,211,238,.07)}
.country-empty{padding:12px;text-align:center;color:var(--muted);font-size:12px}

.bottom{position:fixed;z-index:50;left:0;right:0;bottom:0;background:rgba(11,18,32,.95);
border-top:1px solid var(--line);backdrop-filter:blur(18px);
padding:8px;display:grid;grid-template-columns:repeat(5,1fr)}
.nav{background:none;color:var(--muted);font-size:10px;padding:6px 3px;cursor:pointer}
.nav b{display:block;font-size:18px;margin-bottom:3px}
.nav.active{color:var(--accent)}
.page{display:none}
.page.active{display:block}

.source-tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}
.source-tab{white-space:nowrap;background:var(--panel);border:1px solid var(--line);
padding:9px 12px;border-radius:12px;font-size:12px;cursor:pointer}
.source-tab.active{border-color:var(--accent);color:var(--accent)}
.form{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.form label{display:block;color:var(--muted);font-size:11px;margin:10px 0 5px}
.form input,.form select{width:100%;background:#0b1325;color:var(--text);
border:1px solid var(--line);border-radius:12px;padding:11px;outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:#1b2b47;color:var(--text);border:1px solid #334765;
border-radius:12px;padding:10px 13px;cursor:pointer}
.btn.primary{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.5);color:var(--accent)}
.btn.danger{color:var(--danger);border-color:rgba(251,113,133,.35)}
.source-list{display:grid;gap:9px;margin-top:12px}
.source-item{background:var(--panel);border:1px solid var(--line);border-radius:15px;
padding:12px;display:flex;align-items:center;gap:10px}
.source-item .grow{flex:1}
.source-item strong{display:block;font-size:13px}
.source-item small{color:var(--muted);font-size:10px}
.notice{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);
border-radius:14px;padding:11px;color:#d8c28a;font-size:11px;line-height:1.5;margin-top:10px}

.pagination{display:flex;justify-content:center;gap:8px;margin:16px 0}
.modal{position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.82);
backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#101b2f;
border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px}
.close{float:right;background:#1c2a43;color:white;border:1px solid var(--line);
border-radius:10px;padding:7px 10px;cursor:pointer}
.video{width:100%;background:#000;border-radius:16px;max-height:58vh}
.details{display:grid;grid-template-columns:130px 1fr;gap:14px;margin-top:12px}
.details img{width:130px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:#0b1220}
.details p{font-size:12px;line-height:1.55;color:#c5cfdd}
.episode{background:#16233b;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:7px;cursor:pointer}
.tiny{font-size:10px;color:var(--muted)}

@media(max-width:820px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:580px){
 .app{padding:10px}.stats{grid-template-columns:repeat(2,1fr)}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .hero{padding:15px}.details{grid-template-columns:95px 1fr}
 .details img{width:95px}.row{grid-template-columns:1fr}.status{display:none}
 .country-list{grid-template-columns:1fr}
}
@media(min-width:1000px){
 body{padding-bottom:20px}
 .bottom{position:sticky;top:8px;bottom:auto;max-width:700px;margin:12px auto;
 border:1px solid var(--line);border-radius:18px}
 .nav{font-size:11px}
}
</style>
</head>

<body>
<div class="app">

<header class="top">
 <div class="brand">
  <div class="logo">N</div>
  <div>
   <h1>NEXWORLD</h1>
   <small>TV • Films • Séries • Sources</small>
  </div>
  <div class="status" id="status">Initialisation…</div>
 </div>
</header>

<section class="hero">
 <h2 id="heroTitle">Votre univers TV</h2>
 <p id="heroText">
  Catalogue mondial, contenus VOD de vos sources autorisées et lecture directement sur Android.
 </p>
</section>

<div class="stats">
 <div class="stat"><b id="nTv">0</b><span>TV Live</span></div>
 <div class="stat"><b id="nMovie">0</b><span>Films</span></div>

 <div class="stat"><b id="nSources">1</b><span>Sources</span></div>

<main>

<section id="page-home" class="page active">
 <div id="homeGrid" class="grid"></div>
</section>

<section id="page-tv" class="page">
 <input id="tvSearch" class="search" placeholder="Rechercher une chaîne…">
 <div id="regions" class="chips"></div>
 <div id="countries"></div>
 <div id="tvGrid" class="grid"></div>
 <div id="tvPages" class="pagination"></div>
</section>

<section id="page-movies" class="page">
 <input id="movieSearch" class="search" placeholder="Rechercher un film…">

 <div id="movieGrid" class="grid"></div>
</section>

<section id="page-series" class="page">
 <input id="seriesSearch" class="search" placeholder="Rechercher une série…">
 <div id="seriesGenres" class="chips"></div>

<section id="page-sources" class="page">
 <div class="source-tabs">
  <button class="source-tab active" data-mode="url">M3U / M3U8</button>

  <button class="source-tab" data-mode="xtream">Xtream</button>
  <button class="source-tab" data-mode="stalker">Stalker / MAG</button>
 </div>

 <div id="sourceForms"></div>
 <div id="sourceList" class="source-list"></div>
</section>

</main>
</div>

<nav class="bottom">
 <button class="nav active" data-page="home"><b>⌂</b>Accueil</button>
 <button class="nav" data-page="tv"><b>▣</b>TV</button>
 <button class="nav" data-page="movies"><b>▶</b>Films</button>
 <button class="nav" data-page="series"><b>▤</b>Séries</button>
 <button class="nav" data-page="sources"><b>⚙</b>Sources</button>
</nav>

<div class="modal" id="modal">
 <div class="sheet">
  <button class="close" id="closeModal">Fermer</button>
  <div id="modalContent"></div>

</div>

<script>
'use strict';

const WORLD_URL='https://iptv-org.github.io/iptv/index.country.m3u';
const COUNTRIES_URL='https://iptv-org.github.io/api/countries.json';

const PAGE_SIZE=48;
const DB_NAME='nexworld_v72';
const DB_STORE='sources';

const GENRES=[
 'Tous','Action','Aventure','Comédie','Drame','Romance','Thriller','Horreur',
 'Science-fiction','Animation','Documentaire','Policier','Famille',
 'Fantastique','Mystère','Western','Guerre','Historique','Musical'
];

const REGIONS={
 Monde:null,
 Afrique:['DZ','AO','BJ','BW','BF','BI','CM','CV','CF','TD','KM','CG','CD','CI','DJ','EG','GQ','ER','SZ','ET','GA','GM','GH','GN','GW','KE','LS','LR','LY','MG','MW','ML','MR','MU','MA','MZ','NA','NE','NG','RW','ST','SN','SC','SL','SO','ZA','SS','SD','TZ','TG','TN','UG','ZM','ZW'],
 Europe:['AL','AD','AT','BY','BE','BA','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IE','IT','XK','LV','LI','LT','LU','MT','MD','MC','ME','NL','MK','NO','PL','PT','RO','RU','SM','RS','SK','SI','ES','SE','CH','TR','UA','GB','VA'],
 Amériques:['AG','AR','BS','BB','BZ','BO','BR','CA','CL','CO','CR','CU','DM','DO','EC','SV','GD','GT','GY','HT','HN','JM','MX','NI','PA','PY','PE','KN','LC','VC','SR','TT','US','UY','VE'],
 Asie:['AF','AM','AZ','BH','BD','BT','BN','KH','CN','GE','HK','IN','ID','IR','IQ','IL','JP','JO','KZ','KW','KG','LA','LB','MY','MV','MN','MM','NP','KP','OM','PK','PS','PH','QA','SA','SG','KR','LK','SY','TW','TJ','TH','TL','TM','AE','UZ','VN','YE'],
 Océanie:['AU','FJ','KI','MH','FM','NR','NZ','PW','PG','WS','SB','TO','TV','VU']
};

const state={
 page:'home',
 channels:[],
 movies:[],
 series:[],
 favorites:[],
 history:[],
 sources:[],
 countries:[],
 country:'',
 countryOpen:false,
 countrySearch:'',
 region:'Monde',
 tvSearch:'',
 movieSearch:'',
 seriesSearch:'',
 movieGenre:'Tous',
 seriesGenre:'Tous',
 tvPage:1,
 sourceMode:'url',
 xtreamSessions:{}
};

const $=id=>document.getElementById(id);

function setStatus(text){
 const el=$('status');
 if(el)el.textContent=text||'';
}

function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function norm(v){return String(v||'').trim()}

function slug(v){
 return norm(v).toLowerCase()
 .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
 .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function parseAttrs(line){
 const out={};
 const re=/([\w-]+)="([^"]*)"|([\w-]+)='([^']*)'/g;
 let m;
 while((m=re.exec(line)))out[m[1]||m[3]]=m[2]??m[4]??'';
 return out;
}

function genreFrom(v){
 const s=norm(v).toLowerCase();
 for(const g of GENRES.slice(1)){
  if(s.includes(slug(g).replaceAll('-',' '))||s.includes(g.toLowerCase()))return g;
 }
 return '';
}

function classify(a,name,group){
 const explicit=(a['content-type']||a['content_type']||a['tvg-type']||
 a['tvg_type']||a.type||a.kind||'').toLowerCase();

 if(['movie','film','vod'].includes(explicit))return 'movie';
 if(['series','serie','tvshow','show'].includes(explicit))return 'series';

 const s=(group+' '+name).toLowerCase();

 if(/\b(series|serie|saison|season|episode|episodes|tv show|tvshow)\b/.test(s))
  return 'series';

 if(/\b(movie|film|films|vod|cinema|cinéma)\b/.test(s))
  return 'movie';

 return 'tv';
}

/*
 IMPORTANT :
 Le moteur mondial reste basé sur index.country.m3u.
 Pour le pays, IPTV-org utilise principalement tvg-country.
 On conserve également les anciens attributs en secours.
*/
function parseM3U(text,source='user'){
 const lines=String(text||'').split(/\r?\n/);
 const out=[];
 let meta=null;

 for(let i=0;i<lines.length;i++){
  const line=lines[i].trim();
  if(!line)continue;

  if(line.startsWith('#EXTINF')){
   meta={
    attrs:parseAttrs(line),
    title:norm(line.split(',').slice(1).join(','))
   };
   continue;
  }

  if(line.startsWith('#'))continue;

  if(meta&&/^https?:\/\//i.test(line)){
   const a=meta.attrs||{};
   const name=norm(a['tvg-name']||meta.title||'Sans titre');
   const group=norm(a['group-title']||'');

   /*
    NE PAS remplacer par une autre source.
    Pour le catalogue mondial :
    source === world => TV uniquement.
   */
   const kind=source==='world'?'tv':classify(a,name,group);

   const countryValue=
    a['tvg-country']||
    a.country||
    a['tvg-country-code']||
    '';

   out.push({
    id:(a.id||a['tvg-id']||source+'-'+out.length)+'|'+line,
    name,
    logo:norm(a['tvg-logo']||a.logo),
    url:line,
    group,
    country:norm(countryValue).toUpperCase(),
    kind,
    genre:genreFrom(a.genre||group+' '+name),
    year:norm(a.year||a.date||''),
    description:norm(a.description||a.plot||a.overview||''),
    duration:norm(a.duration||a['duration-min']||''),
    rating:norm(a.rating||a['rating']||''),
    seriesId:norm(a['series-id']||a.series_id||''),
    season:norm(a.season||a['season-number']||''),
    episode:norm(a.episode||a['episode-number']||''),
    source
   });

   meta=null;
  }
 }

 return out;
}

function dedupe(arr){
 const m=new Map();
 for(const x of arr){
  const k=(x.url||'')+'|'+x.name+'|'+x.kind;
  if(!m.has(k))m.set(k,x);
 }
 return [...m.values()];
}

function saveLS(){
 localStorage.setItem('nw72_fav',JSON.stringify(state.favorites));
 localStorage.setItem('nw72_hist',JSON.stringify(state.history));
}

function loadLS(){
 try{
  state.favorites=JSON.parse(localStorage.getItem('nw72_fav')||'[]');
  state.history=JSON.parse(localStorage.getItem('nw72_hist')||'[]');
 }catch{
  state.favorites=[];
  state.history=[];
 }
}

function isFav(x){return state.favorites.includes(x.id)}

function toggleFav(x,e){
 if(!x)return;
 e?.stopPropagation();

 if(isFav(x))
  state.favorites=state.favorites.filter(id=>id!==x.id);
 else
  state.favorites.push(x.id);

 saveLS();
 render();
}

function addHistory(x){
 state.history=[x.id,...state.history.filter(id=>id!==x.id)].slice(0,100);
 saveLS();
}

function findById(id){
 return [...state.channels,...state.movies,...state.series].find(x=>x.id===id);
}

function card(x){
 const poster=x.logo||'';

 return `<article class="card" data-id="${esc(x.id)}">
 <button class="fav ${isFav(x)?'on':''}" data-fav="${esc(x.id)}">
  ${isFav(x)?'★':'☆'}
 </button>
 <div class="poster">
  ${poster?`<img loading="lazy" src="${esc(poster)}" alt="">`:
  '<span class="tiny">NEXWORLD</span>'}
 </div>
 <div class="cardbody">
  <div class="title">${esc(x.name)}</div>
  <div class="meta">
   ${esc(x.genre||x.group||x.country||'')}
   ${x.year?' • '+esc(x.year):''}
   ${x.rating?' • ★ '+esc(x.rating):''}
  </div>
 </div>
 </article>`;
}

function bindGrid(id,arr){
 const el=$(id);

 el.innerHTML=arr.length
  ?arr.map(card).join('')
  :'<div class="empty">Aucun contenu correspondant.</div>';

 el.querySelectorAll('[data-fav]').forEach(b=>{
  b.addEventListener('click',e=>{
   toggleFav(findById(b.dataset.fav),e);
  });
 });

 el.querySelectorAll('.card').forEach(c=>{
  c.addEventListener('click',e=>{
   if(e.target.closest('[data-fav]'))return;
   const x=findById(c.dataset.id);
   if(x)openItem(x);
  });
 });
}

/*
 CORRECTION DÉFINITIVE DU FILTRE PAYS :
 - accepte FR
 - accepte fr
 - accepte FR;BE
 - accepte FR,BE
 - compare toujours en majuscules
*/
function countryCodes(value){
 return String(value??'')
 .split(/[;,]/)
 .map(v=>v.trim().toUpperCase())
 .filter(Boolean);
}

function countryMatches(x,code){
 const target=String(code||'').trim().toUpperCase();
 if(!target)return true;

 const itemCodes=countryCodes(x?.country);

 if(itemCodes.includes(target))return true;

 return false;
}

function regionMatches(x,codes){
 return (Array.isArray(codes)?codes:[])
 .some(code=>countryMatches(x,code));
}

function filteredTV(){
 let a=state.channels;

 if(state.region!=='Monde'){
  const codes=REGIONS[state.region]||[];
  a=a.filter(x=>regionMatches(x,codes));
 }

 if(state.country)
  a=a.filter(x=>countryMatches(x,state.country));

 const q=state.tvSearch.toLowerCase();

 if(q)
  a=a.filter(x=>
   (x.name+' '+x.group).toLowerCase().includes(q)
  );

 return a;
}

function filteredVOD(type){
 let a=type==='movie'?state.movies:state.series;

 const q=(type==='movie'?state.movieSearch:state.seriesSearch).toLowerCase();
 const g=type==='movie'?state.movieGenre:state.seriesGenre;

 if(q)
  a=a.filter(x=>
   (x.name+' '+x.genre+' '+x.description).toLowerCase().includes(q)
  );

 if(g!=='Tous')
  a=a.filter(x=>x.genre===g);

 return a;
}

function renderStats(){
 $('nTv').textContent=state.channels.length.toLocaleString('fr-FR');
 $('nMovie').textContent=state.movies.length.toLocaleString('fr-FR');
 $('nSeries').textContent=state.series.length.toLocaleString('fr-FR');
 $('nSources').textContent=String(1+state.sources.length);
}

function renderRegions(){
 const el=$('regions');

 el.innerHTML=Object.keys(REGIONS).map(r=>
  `<button class="chip ${state.region===r?'active':''}" data-region="${r}">
   ${r}
  </button>`
 ).join('');

 el.querySelectorAll('[data-region]').forEach(b=>{
  b.onclick=()=>{
   state.region=b.dataset.region;

   /*
    Changer de région réinitialise le pays :
    cela évite les combinaisons impossibles.
   */
   state.country='';
   state.countrySearch='';
   state.countryOpen=false;
   state.tvSearch='';
   state.tvPage=1;

   const q=$('tvSearch');

function countryName(code){
 const c=String(code||'').toUpperCase();
 if(!c)return '';

 try{
  const d=new Intl.DisplayNames(['fr'],{type:'region'});
  return d.of(c)||c;
 }catch{
  return c;
 }
}

function normalizeCountries(list){
 return (Array.isArray(list)?list:[])
 .map(c=>{
  const code=String(
   c?.code||
   c?.cca2||
   c?.alpha2||
   ''
  ).toUpperCase();

  const name=
   norm(
    c?.name||
    c?.translations?.fra?.common||
    c?.translations?.fra||
    ''
   )||countryName(code);

  return code?{code,name}:null;
 })
 .filter(Boolean);
}

function countriesFromChannels(){
 const codes=[
  ...new Set(
   state.channels
   .flatMap(x=>countryCodes(x.country))
   .filter(c=>/^[A-Z]{2}$/.test(c))
  )
 ];

 return codes.map(code=>({
  code,
  name:countryName(code)
 }));
}

function resolvePlaybackURL(x){
 if(x?.url)return x.url;

 if(x?.xtreamType&&x?.source){

  const session=state.xtreamSessions[x.source];

  if(!session)return '';

  const base=session.server.replace(/\/+$/,'');
  const u=encodeURIComponent(session.user);
  const p=encodeURIComponent(session.password);

  if(
   x.xtreamType==='live'&&
   x.streamId
  )
   return `${base}/live/${u}/${p}/${encodeURIComponent(x.streamId)}.m3u8`;

  if(
   x.xtreamType==='movie'&&
   x.streamId
  )
   return `${base}/movie/${u}/${p}/${encodeURIComponent(x.streamId)}.${x.container||'mp4'}`;
 }

 return '';
}

function openDB(){
 return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,1);

  r.onupgradeneeded=()=>{
   if(!r.result.objectStoreNames.contains(DB_STORE))
    r.result.createObjectStore(DB_STORE,{keyPath:'id'});
  };

  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
 });
}

async function dbPut(x){
 const db=await openDB();

 return new Promise((res,rej)=>{
  const tx=db.transaction(DB_STORE,'readwrite');

  tx.objectStore(DB_STORE).put(x);

  tx.oncomplete=()=>res();
  tx.onerror=()=>rej(tx.error);
 });
}

async function dbAll(){
 const db=await openDB();

 return new Promise((res,rej)=>{
  const tx=db.transaction(DB_STORE,'readonly');
  const r=tx.objectStore(DB_STORE).getAll();

  r.onsuccess=()=>res(r.result||[]);
  r.onerror=()=>rej(r.error);
 });
}

async function dbDel(id){
 const db=await openDB();

 return new Promise((res,rej)=>{
  const tx=db.transaction(DB_STORE,'readwrite');

  tx.objectStore(DB_STORE).delete(id);

  tx.oncomplete=()=>res();
  tx.onerror=()=>rej(tx.error);
 });
}

async function addURL(){

 const name=norm($('srcName').value)||'Playlist M3U';
 const url=norm($('srcUrl').value);

 if(!/^https?:\/\//i.test(url)){
  alert('URL M3U invalide.');
  return;
 }

 setStatus('Chargement de la playlist…');

 try{
  const r=await fetch(url,{cache:'no-store'});

  if(!r.ok)
   throw new Error('HTTP '+r.status);

  const text=await r.text();

  const s={
   id:'src-'+Date.now(),
   name,
   type:'M3U URL',
   url,
   enabled:true
  };

  s._items=
   dedupe(parseM3U(text,'user'))
   .map(x=>({...x,source:s.id}));

  s.items=s._items.length;

  await dbPut({...s,text});

  state.sources.push(s);

  applyUserItems();
  render();

  setStatus('En ligne');

  alert(`${s.items} éléments importés.`);

 }catch(e){

  setStatus('Erreur source');

  alert(
   'Impossible de charger la playlist. Vérifiez URL, CORS et autorisation.'
  );
 }
}

async function addXtream(){

 const name=norm($('xtName').value)||'Profil Xtream';
 const server=norm($('xtServer').value);
 const user=norm($('xtUser').value);
 const pass=norm($('xtPass').value);

 if(!server||!user||!pass){
  alert('Serveur, identifiant et mot de passe sont requis.');
  return;
 }

 if(!window.NEXWORLD_AUTH?.xtreamSecureRequest){
  alert(
   'Le module de connexion sécurisée n’est pas disponible. Vérifiez firebase-auth.js.'
  );
  return;
 }

 setStatus('Connexion Xtream sécurisée…');

 try{

  await window.NEXWORLD_AUTH.xtreamSecureRequest({
   action:'info',
   server,
   username:user,
   password:pass
  });

  const srcId='src-'+Date.now();

  const src={
   id:srcId,
   name,
   type:'Xtream',
   url:server,
   user,
   enabled:true,
   items:0,
   _items:[],
   xtream:true
  };

  state.xtreamSessions[srcId]={
   server:server.replace(/\/+$/,''),
   user,
   password:pass
  };

  const [liveRes,vodRes,seriesRes]=
   await Promise.all([
    window.NEXWORLD_AUTH.xtreamSecureRequest({
     action:'live',
     server,
     username:user,
     password:pass
    }),
    window.NEXWORLD_AUTH.xtreamSecureRequest({
     action:'vod',
     server,
     username:user,
     password:pass
    }),
    window.NEXWORLD_AUTH.xtreamSecureRequest({
     action:'series',
     server,
     username:user,
     password:pass
    })
   ]);

  const live=
   (Array.isArray(liveRes.data)?liveRes.data:[])
   .map((x,i)=>({
    id:`${srcId}-live-${x.stream_id||i}`,
    name:norm(x.name)||'Chaîne',
    logo:norm(x.stream_icon),
    url:'',
    group:norm(x.category_name||x.category_id||''),
    country:'',
    kind:'tv',
    genre:'',
    source:srcId,
    streamId:x.stream_id,
    xtreamType:'live'
   }));

  const movies=
   (Array.isArray(vodRes.data)?vodRes.data:[])
   .map((x,i)=>({
    id:`${srcId}-movie-${x.stream_id||i}`,
    name:norm(x.name)||'Film',
    logo:norm(x.stream_icon),
    url:'',
    group:norm(x.category_name||x.category_id||''),
    country:'',
    kind:'movie',
    genre:genreFrom(x.genre||x.category_name||''),
    year:norm(x.year||''),
    description:norm(x.plot||x.overview||''),
    duration:norm(x.duration||''),
    rating:norm(x.rating||''),
    source:srcId,
    streamId:x.stream_id,
    xtreamType:'movie',
    container:norm(x.container_extension||'mp4')
   }));

  const shows=
   (Array.isArray(seriesRes.data)?seriesRes.data:[])
   .map((x,i)=>({
    id:`${srcId}-series-${x.series_id||i}`,
    name:norm(x.name)||'Série',
    logo:norm(x.cover||x.poster),
    url:'',
    group:norm(x.category_name||x.category_id||''),
    country:'',
    kind:'series',
    genre:genreFrom(x.genre||x.category_name||''),
    year:norm(x.year||''),
    description:norm(x.plot||x.overview||''),
    rating:norm(x.rating||''),
    source:srcId,
    seriesId:x.series_id,
    xtreamType:'series'
   }));

  src._items=[
   ...live,
   ...movies,
   ...shows
  ];

  src.items=src._items.length;

  state.sources.push(src);

  await dbPut(src);

  applyUserItems();
  render();

  setStatus('Xtream connecté');

  alert(
   `Connexion Xtream réussie : ${live.length} TV, ${movies.length} films, ${shows.length} séries.`
  );

 }catch(e){

  console.error(e);

  setStatus('Erreur Xtream');

  alert(
   'Connexion Xtream impossible : '+
   (e?.message||'erreur inconnue')
  );
 }
}

function addStalker(){

 const name=norm($('stName').value)||'Profil MAG';
 const portal=norm($('stPortal').value);
 const mac=norm($('stMac').value);

 if(!portal||!mac){
  alert('Portail et adresse MAC requis.');
  return;
 }

 if(!/^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$/.test(mac)){
  alert(
   'Adresse MAC invalide. Exemple : 00:1A:79:12:34:56'
  );
  return;
 }

 const s={
  id:'src-'+Date.now(),
  name,
  type:'Stalker/MAG',
  url:portal,
  mac,
  model:$('stModel').value,
  enabled:true,
  items:0,
  _items:[]
 };

 state.sources.push(s);

 dbPut(s);
 render();

 alert('Profil Stalker/MAG enregistré.');
}

async function toggleSource(i){
 const s=state.sources[i];

 if(!s)return;

 s.enabled=s.enabled===false;

 await dbPut(s);

 applyUserItems();
 render();
}

async function deleteSource(i){

 const s=state.sources[i];

 if(!s)return;

 if(!confirm('Supprimer cette source ?'))
  return;

 state.sources.splice(i,1);

 await dbDel(s.id);

 applyUserItems();
 render();
}

async function loadSavedSources(){

 try{

  const arr=await dbAll();

  state.sources=arr;

  for(const s of state.sources){

   if(
    s.type==='M3U URL'||
    s.type==='M3U local'
   ){
    if(s.text){
     s._items=
      dedupe(parseM3U(s.text,'user'))
      .map(x=>({...x,source:s.id}));
    }
   }

   if(
    s.type==='Flux direct'&&
    !s._items?.length&&
    s.url
   ){
    s._items=[{
     id:s.id+'|'+s.url,
     name:s.name,
     url:s.url,
     logo:'',
     group:'',
     country:'',
     kind:'tv',
     genre:'',
     source:s.id
    }];
   }
  }

  applyUserItems();

 }catch(e){
  console.warn('IndexedDB',e);
 }
}

function applyUserItems(){

 const active=
  state.sources.filter(
   s=>s.enabled!==false
  );

 const all=
  active.flatMap(
   s=>s._items||[]
  );

 /*
  Le catalogue mondial reste intact.
 */
 state.channels=
  state.channels.filter(
   x=>x.source==='world'
  );

 state.movies=[];
 state.series=[];

 for(const s of active){

  const items=s._items||[];

  state.channels.push(
   ...items.filter(x=>x.kind==='tv')
  );

  state.movies.push(
   ...items.filter(x=>x.kind==='movie')
  );

  state.series.push(
   ...items.filter(x=>x.kind==='series')
  );
 }

 state.channels=dedupe(state.channels);
 state.movies=dedupe(state.movies);
 state.series=dedupe(state.series);
}

async function loadCountries(){

 try{

  const r=await fetch(
   COUNTRIES_URL,
   {cache:'no-store'}
  );

  if(r.ok){

   const data=await r.json();

   state.countries=
    normalizeCountries(data);
  }

 }catch(e){

  console.warn(
   'Pays API indisponible, utilisation du fallback local.',
   e
  );
 }

 if(!state.countries.length)
  state.countries=countriesFromChannels();

 renderTV();
}

async function loadWorld(){

 try{

  setStatus('Chargement TV mondiale…');

  const r=await fetch(
   WORLD_URL,
   {cache:'no-store'}
  );

  if(!r.ok)
   throw new Error('HTTP '+r.status);

  const text=await r.text();

  state.channels=
   dedupe(
    parseM3U(text,'world')
   );

  setStatus('En ligne');

  render();

 }catch(e){

  console.error(e);

  setStatus('TV indisponible');

  state.channels=[];

  render();
 }
}
