<script>
'use strict';

/* =========================================================
   SOCLE TV V6.2 — NE PAS MODIFIER
   ========================================================= */

const WORLD_URL =
'https://iptv-org.github.io/iptv/index.country.m3u';

const PAGE_SIZE = 48;

const state = {
channels: [],
vod: [],
favorites: [],
history: [],
country: 'all',
region: 'all',
genre: 'all',
search: '',
page: 1,
view: 'home',
loading: false,
sources: []
};

const $ =
id => document.getElementById(id);

function safeRead(key,fallback){

try{

const value =
localStorage.getItem(key);

return value
? JSON.parse(value)
: fallback;

}catch(error){

return fallback;

}

}

function safeWrite(key,value){

try{

localStorage.setItem(
key,
JSON.stringify(value)
);

}catch(error){}

}

function toast(message){

const element =
$('toast');

element.textContent =
message;

element.classList.add('show');

clearTimeout(toast.timer);

toast.timer =
setTimeout(
() =>
element.classList.remove('show'),
2200
);

}

function status(text,type=''){

$('status').textContent =
text;

$('status').className =
'status ' + type;

}

function clean(value){

return String(value || '')
.replace(/\s+/g,' ')
.trim();

}

function flag(country){

const flags = {

China:'🇨🇳',

'New Zealand':'🇳🇿',

Turquie:'🇹🇷',
Egypt:'🇪🇬',
'Égypte':'🇪🇬'

};

return flags[country] || '🌐';

}

const regionMap = {

africa:new Set([
'Côte d’Ivoire',
"Côte d'Ivoire",
'Ghana',
'Nigeria',
'Senegal',
'Sénégal',
'Cameroon',
'Cameroun',

'Madagascar',

]),

europe:new Set([

]),

americas:new Set([

]),

oceania:new Set([

'Tonga'
])

};

function region(country){

for(
const [name,set]
of Object.entries(regionMap)
){

if(set.has(country))
return name;

}

return 'other';

}

/* =========================================================
   PARSER
   CORRECTION IMPORTANTE :
   WORLD = TOUJOURS TV
   ========================================================= */

function parseM3U(text,source='user'){

const output = [];

const lines =
String(text || '')
.replace(/\r/g,'')
.split('\n');

let meta = null;

for(
const raw of lines
){

const line =
raw.trim();

if(!line)
continue;

if(
line.startsWith('#EXTINF')
){

const attributes = {};

for(
const match of line.matchAll(
/([\w-]+)="([^"]*)"/g
)
){

attributes[match[1]] =
match[2];

}

const comma =
line.indexOf(',');

const name =
clean(
comma >= 0
? line.slice(comma + 1)
: attributes['tvg-name'] ||
'Chaîne'
);

const group =
clean(
attributes['group-title'] ||
''
);

const country =
clean(
attributes.country ||
group
);

/*
Le catalogue IPTV-org mondial est verrouillé
en TV. Aucune heuristique VOD ne peut le sortir
du catalogue TV.
*/

let kind = 'tv';

if(
source !== 'world'
){

const explicit =
clean(
attributes['content-type'] ||
attributes.type ||
attributes.kind ||
''
).toLowerCase();

const hay =
(group + ' ' + name)
.toLowerCase();

if(
/movie|film|vod/.test(explicit) ||
/(^|[ /_-])(movie|movies|film|films|vod)([ /_-]|$)/.test(hay)
){

kind = 'movie';

}else if(
/series|serie|série|season|saison|episode|épisode/.test(explicit) ||
/(series|série|season|saison|episode|épisode)/.test(hay)
){

kind = 'series';

}

}

meta = {

name,

logo:
attributes['tvg-logo'] ||
'',

group:
group ||
'TV',

country,

countryKey:
country.toLowerCase(),

region:
region(country),

id:
attributes['tvg-id'] ||
name,

url:'',

kind,

genre:
clean(
attributes.genre ||
attributes.category ||
''
),

year:
clean(
attributes.year ||
''

),

source

};

}else if(

!line.startsWith('#') &&
meta &&
/^https?:\/\//i.test(line)

){

meta.url =
line;

output.push({
...meta
});

meta = null;

}

}

return output;

}

/* =========================================================
   CHARGEMENT TV V6.2 — CONSERVÉ
   ========================================================= */

async function loadWorld(){

const response =
await fetch(
WORLD_URL,
{
cache:'no-store'
}
);

if(!response.ok){

throw new Error(
'HTTP ' +
response.status
);

}

return parseM3U(
await response.text(),
'world'
);

}

function unique(channels){

const seen =
new Set();

return channels.filter(
channel => {

const key =
(
channel.url ||
channel.id ||
channel.name
).toLowerCase();

if(
seen.has(key)
){

return false;

}

seen.add(key);

return true;

}
);

}

function channelKey(channel){

return (
channel.url ||
channel.id ||
channel.name
);

}

function isFavorite(channel){

return state.favorites.includes(
channelKey(channel)
);

}

function saveState(){

safeWrite(
'nexworld_v71_favorites',
state.favorites
);

safeWrite(
'nexworld_v71_history',
state.history
);

safeWrite(
'nexworld_v71_sources',
state.sources
);

}

function toggleFavorite(channel){

const key =
channelKey(channel);

if(
isFavorite(channel)
){

state.favorites =
state.favorites.filter(
item =>
item !== key
);

toast('Retiré des favoris');

}else{

state.favorites.push(key);

toast('Ajouté aux favoris');

}

saveState();

render();

}

function addHistory(channel){

state.history = [

channel,

...state.history.filter(
item =>
channelKey(item) !==
channelKey(channel)
)

].slice(0,12);

saveState();

}

function tvFiltered(){

let channels =
state.channels;

if(
state.country !== 'all'
){

channels =
channels.filter(
channel =>
channel.countryKey ===
state.country
);

}

if(
state.region !== 'all'
){

channels =
channels.filter(
channel =>
channel.region ===
state.region
);

}

const query =
state.search
.toLowerCase()
.trim();

if(query){

channels =
channels.filter(
channel =>
(
channel.name +
' ' +
channel.country +
' ' +
channel.group
)
.toLowerCase()
.includes(query)
);

}

return channels;

}

function genreOf(channel){

const value =
(
channel.genre ||
channel.group ||
''
).toLowerCase();

const normalized =
value.normalize
? value.normalize('NFD')
.replace(
/[\u0300-\u036f]/g,
''
)
: value;

const names = [
'Action',
'Aventure',
'Comédie',
'Drame',
'Romance',
'Thriller',
'Horreur',
'Science-fiction',
'Animation',
'Documentaire',
'Policier',
'Famille',
'Fantastique',
'Mystère',
'Western',
'Guerre',
'Historique',
'Musical'
];

const found =
names.find(
name => {

const n =
name.toLowerCase();

const nn =
n.normalize
? n.normalize('NFD')
.replace(
/[\u0300-\u036f]/g,
''
)
: n;

return (
value.includes(n) ||
normalized.includes(nn)
);

}
);

return found || '';

}

function vodFiltered(kind){

let items =
state.vod.filter(
item =>
item.kind === kind
);

if(
state.genre !== 'all'
){

items =
items.filter(
item =>
genreOf(item) ===
state.genre
);

function escapeHTML(value){

}[match])
);

async function addURL(){

$('srcName').value.trim() ||

$('srcUrl').value.trim();

toast('URL manquante');

return;

}

try{

status('Chargement source…');

const response =
await fetch(
url,
{
cache:'no-store'
}
);

if(!response.ok){

throw new Error(
'HTTP ' + response.status
);

}

const sourceId =
String(
Date.now()
);

const items =
parseM3U(
await response.text(),
'm3u-url'
);

items.forEach(
item =>
item.sourceId =
sourceId
);

state.channels =
unique([
...state.channels,
...items.filter(
item =>
item.kind === 'tv'
)
]);

state.vod =
unique([
...state.vod,
...items.filter(
item =>
item.kind !== 'tv'
)
]);

state.sources.push({

id:sourceId,
type:'m3u-url',
name,
url

});

saveState();

status(
'TV connectée',
'ok'
);

toast(
items.length +
' éléments ajoutés'
);

render();

}catch(error){

console.error(error);

status(
'Erreur source',
'err'
);

toast(
'Impossible de charger cette playlist'
);

}

}

}

function boot(){

state.favorites =
safeRead(
'nexworld_v71_favorites',
[]
);

state.history =
safeRead(
'nexworld_v71_history',
[]
);

state.sources =
safeRead(
'nexworld_v71_sources',
[]
);

render();

start();

}

window.addEventListener(
'error',
event =>
console.error(
'NEXWORLD error:',
event.error ||
event.message
)
);

window.addEventListener(
'unhandledrejection',
event =>
console.error(
'NEXWORLD promise:',
event.reason
)
);

if(
document.readyState === 'loading'
){

document.addEventListener(
'DOMContentLoaded',
boot,
{once:true}
);

}else{

boot();

}
</script>

</body>
</html>
