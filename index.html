<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="description" content="NEXWORLD — télévision en direct">
<title>NEXWORLD V6.2</title>

<style>
:root{
--bg:#0F172A;
--panel:#111c31;
--panel2:#16233d;
--text:#f8fafc;
--muted:#94a3b8;
--line:#263653;
--cyan:#22d3ee;
--green:#34d399;
--amber:#fbbf24;
--pink:#f472b6;
--danger:#fb7185
}

*{box-sizing:border-box}

html,body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}

body{
min-height:100vh;
padding-bottom:82px
}

button,input,select{font:inherit}

button{
border:0;
color:inherit;
cursor:pointer
}

.app{
max-width:980px;
margin:auto;
padding:14px
}

.top{
position:sticky;
top:0;
z-index:20;
background:rgba(15,23,42,.94);
backdrop-filter:blur(14px);
padding:8px 0 12px
}

.brand{
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-weight:900;
letter-spacing:.08em;
font-size:23px
}

.logo b{color:var(--cyan)}

.status{
font-size:11px;
padding:6px 9px;
border-radius:999px;
background:#1e293b;
color:var(--amber)
}

.status.ok{color:var(--green)}
.status.err{color:var(--danger)}

.hero{
margin:10px 0;
padding:18px;
border:1px solid var(--line);
border-radius:24px;
background:linear-gradient(
145deg,
rgba(34,211,238,.08),
rgba(244,114,182,.04)
);
box-shadow:0 18px 45px rgba(0,0,0,.2)
}

.hero h1{
margin:0 0 5px;
font-size:25px
}

.hero p{
margin:0;
color:var(--muted);
font-size:13px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:14px
}

.stat{
background:rgba(255,255,255,.035);
border:1px solid var(--line);
border-radius:15px;
padding:10px
}

.stat strong{
display:block;
font-size:19px
}

.stat span{
font-size:11px;
color:var(--muted)
}

.tools{
display:grid;
grid-template-columns:1fr auto;
gap:8px;
margin:12px 0
}

.search{
width:100%;
padding:13px 14px;
border-radius:15px;
border:1px solid var(--line);
background:#0b1324;
color:var(--text);
outline:none
}

.search:focus{border-color:var(--cyan)}

.btn{
padding:12px 14px;
border-radius:14px;
background:var(--panel2);
border:1px solid var(--line)
}

.filters{
display:grid;
grid-template-columns:1fr auto;
gap:8px;
margin-bottom:10px
}

.select{
width:100%;
padding:11px 12px;
border-radius:14px;
border:1px solid var(--line);
background:#111b2e;
color:var(--text);
outline:none
}

.countHint{
display:flex;
align-items:center;
padding:0 10px;
border:1px solid var(--line);
border-radius:14px;
color:var(--muted);
font-size:11px;
white-space:nowrap
}

.chips{
display:flex;
gap:7px;
overflow:auto;
padding:2px 0 9px;
scrollbar-width:none
}

.chip{
white-space:nowrap;
padding:8px 12px;
border-radius:999px;
background:#111b2e;
border:1px solid var(--line);
font-size:12px
}

.chip.active{
border-color:var(--cyan);
color:var(--cyan);
background:rgba(34,211,238,.08)
}

.section{margin:18px 0}

.sectionHead{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:10px
}

.sectionHead h2{
font-size:16px;
margin:0
}

.sectionHead span{
font-size:11px;
color:var(--muted)
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:9px
}

.card{
position:relative;
min-height:112px;
padding:11px;
border-radius:17px;
border:1px solid var(--line);
background:linear-gradient(145deg,#111c31,#0e1729);
overflow:hidden
}

.card:active{transform:scale(.985)}

.fav{
position:absolute;
right:8px;
top:7px;
width:31px;
height:31px;
border-radius:50%;
background:rgba(2,6,23,.72);
border:1px solid var(--line);
z-index:2
}

.fav.on{color:var(--pink)}

.channelLogo{
width:54px;
height:38px;
object-fit:contain;
border-radius:8px;
background:#020617;
display:block;
margin-bottom:9px
}

.channelName{
font-weight:750;
font-size:13px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
padding-right:30px
}

.meta{
font-size:10px;
color:var(--muted);
margin-top:4px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.empty{
padding:24px;
text-align:center;
border:1px dashed var(--line);
border-radius:17px;
color:var(--muted);
font-size:13px
}

.more{
display:block;
margin:12px auto 0;
padding:11px 16px;
border-radius:14px;
background:var(--panel2);
border:1px solid var(--line)
}

.player{
position:fixed;
inset:0;
background:#000;
z-index:50;
display:none;
flex-direction:column
}

.player.show{display:flex}

.videoWrap{
flex:1;
display:flex;
align-items:center;
justify-content:center
}

.player video{
width:100%;
max-height:80vh;
background:#000
}

.playerBar{
padding:
12px
calc(12px + env(safe-area-inset-right))
calc(12px + env(safe-area-inset-bottom))
calc(12px + env(safe-area-inset-left));
background:#0b1220
}

.playerTitle{
font-weight:800;
margin-bottom:9px
}

.playerBtns{
display:flex;
gap:8px
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:30;
padding:
8px
max(10px,env(safe-area-inset-left))
calc(8px + env(safe-area-inset-bottom))
max(10px,env(safe-area-inset-right));
background:rgba(8,15,29,.95);
backdrop-filter:blur(16px);
border-top:1px solid var(--line);
display:flex;
justify-content:center
}

.nav{
display:flex;
width:min(520px,100%);
justify-content:space-around
}

.nav button{
background:none;
color:var(--muted);
font-size:11px;
padding:5px 12px
}

.nav button.active{color:var(--cyan)}

.toast{
position:fixed;
left:50%;
bottom:90px;
transform:translateX(-50%) translateY(20px);
background:#020617;
border:1px solid var(--line);
padding:10px 14px;
border-radius:999px;
font-size:12px;
opacity:0;
pointer-events:none;
transition:.2s;
z-index:100;
white-space:nowrap
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0)
}

.spin{
display:inline-block;
width:13px;
height:13px;
border:2px solid #334155;
border-top-color:var(--cyan);
border-radius:50%;
animation:sp .8s linear infinite;
vertical-align:-2px
}

@keyframes sp{
to{transform:rotate(360deg)}
}

@media(min-width:650px){
.grid{
grid-template-columns:repeat(4,minmax(0,1fr))
}

.app{padding:18px}
}
</style>
</head>

<script>
'use strict';

const WORLD_URL =
'https://iptv-org.github.io/iptv/index.country.m3u';

const PAGE_SIZE = 48;

const state = {
channels: [],
favorites: [],
history: [],
country: 'all',
region: 'all',
search: '',
page: 1,
loading: false
};

const $ = id =>
document.getElementById(id);

function safeRead(key, fallback){

try{

const value =
localStorage.getItem(key);

return value
? JSON.parse(value)
: fallback;

}catch(error){

return fallback;

}

}

function safeWrite(key,value){

try{

localStorage.setItem(
key,
JSON.stringify(value)
);

}catch(error){}

}

function toast(message){

const element =
$('toast');

element.textContent =
message;

element.classList.add('show');

clearTimeout(toast.timer);

toast.timer =
setTimeout(
() =>
element.classList.remove('show'),
2200
);

}

function status(text,type=''){

const element =
$('status');

element.textContent =
text;

element.className =
'status ' + type;

}

function clean(value){

return String(value || '')
.replace(/\s+/g,' ')
.trim();

}

function flag(country){

const flags = {

'Côte d’Ivoire':'🇨🇮',
"Côte d'Ivoire":'🇨🇮',
'France':'🇫🇷',
'Ghana':'🇬🇭',
'Nigeria':'🇳🇬',
'Senegal':'🇸🇳',
'Sénégal':'🇸🇳',
'Cameroon':'🇨🇲',
'Cameroun':'🇨🇲',
'South Africa':'🇿🇦',
'Afrique du Sud':'🇿🇦',
'Kenya':'🇰🇪',
'Morocco':'🇲🇦',
'Maroc':'🇲🇦',
'Algeria':'🇩🇿',
'Algérie':'🇩🇿',
'Tunisia':'🇹🇳',
'Tunisie':'🇹🇳',
'Mali':'🇲🇱',
'Burkina Faso':'🇧🇫',
'Togo':'🇹🇬',
'Benin':'🇧🇯',
'Bénin':'🇧🇯',
'Guinea':'🇬🇳',
'Guinée':'🇬🇳',
'Gabon':'🇬🇦',
'Congo':'🇨🇬',
'DR Congo':'🇨🇩',
'United States':'🇺🇸',
'USA':'🇺🇸',
'Canada':'🇨🇦',
'United Kingdom':'🇬🇧',
'UK':'🇬🇧',
'Germany':'🇩🇪',
'Allemagne':'🇩🇪',
'Italy':'🇮🇹',
'Italie':'🇮🇹',
'Spain':'🇪🇸',
'Espagne':'🇪🇸',
'Belgium':'🇧🇪',
'Belgique':'🇧🇪',
'Switzerland':'🇨🇭',
'Suisse':'🇨🇭',
'Portugal':'🇵🇹',
'Brazil':'🇧🇷',
'Brésil':'🇧🇷',
'Argentina':'🇦🇷',
'Japan':'🇯🇵',
'Japon':'🇯🇵',
'South Korea':'🇰🇷',
'Corée du Sud':'🇰🇷',
'China':'🇨🇳',
'India':'🇮🇳',
'Inde':'🇮🇳',
'Australia':'🇦🇺',
'New Zealand':'🇳🇿',
'Mexico':'🇲🇽',
'Mexique':'🇲🇽',
'Turkey':'🇹🇷',
'Turquie':'🇹🇷',
'Egypt':'🇪🇬',
'Égypte':'🇪🇬'

};

return flags[country] || '🌐';

}

const regionMap = {

africa:new Set([
'Côte d’Ivoire',
"Côte d'Ivoire",
'Ghana',
'Nigeria',
'Senegal',
'Sénégal',
'Cameroon',
'Cameroun',
'South Africa',
'Afrique du Sud',
'Kenya',
'Morocco',
'Maroc',
'Algeria',
'Algérie',
'Tunisia',
'Tunisie',
'Mali',
'Burkina Faso',
'Togo',
'Benin',
'Bénin',
'Guinea',
'Guinée',
'Gabon',
'Congo',
'DR Congo',
'Madagascar',
'Mozambique',
'Namibia',
'Ethiopia',
'Uganda',
'Tanzania',
'Zambia',
'Zimbabwe'
]),

europe:new Set([
'France',
'Germany',
'Allemagne',
'Italy',
'Italie',
'Spain',
'Espagne',
'Belgium',
'Belgique',
'Switzerland',
'Suisse',
'Portugal',
'United Kingdom',
'UK',
'Ireland',
'Netherlands',
'Austria',
'Poland',
'Norway',
'Sweden',
'Denmark',
'Finland',
'Greece',
'Romania',
'Croatia',
'Serbia'
]),

americas:new Set([
'United States',
'USA',
'Canada',
'Mexico',
'Mexique',
'Brazil',
'Brésil',
'Argentina',
'Chile',
'Colombia',
'Peru',
'Venezuela',
'Uruguay',
'Ecuador',
'Bolivia'
]),

asia:new Set([
'Japan',
'Japon',
'China',
'India',
'Inde',
'South Korea',
'Corée du Sud',
'Indonesia',
'Thailand',
'Vietnam',
'Malaysia',
'Singapore',
'Philippines',
'Pakistan',
'Bangladesh'
]),

oceania:new Set([
'Australia',
'New Zealand',
'Fiji',
'Samoa',
'Tonga'
])

};

function region(country){

for(
const [name,set]
of Object.entries(regionMap)
){

if(set.has(country))
return name;

}

return 'other';

}

function parseM3U(text){

const channels = [];

const lines =
String(text || '')
.replace(/\r/g,'')
.split('\n');

let meta = null;

for(
const raw of lines
){

const line =
raw.trim();

if(!line)
continue;

if(
line.startsWith('#EXTINF')
){

const attributes = {};

for(
const match
of line.matchAll(
/([\w-]+)="([^"]*)"/g
)
){

attributes[match[1]] =
match[2];

}

const comma =
line.indexOf(',');

const name =
clean(
comma >= 0
? line.slice(comma + 1)
: attributes['tvg-name'] ||
'Chaîne'
);

const country =
clean(
attributes['group-title'] ||
''
);

meta = {

name,

logo:
attributes['tvg-logo'] ||
'',

group:
attributes['group-title'] ||
'TV',

country,

countryKey:
country.toLowerCase(),

region:
region(country),

id:
attributes['tvg-id'] ||
name

};

}

else if(

!line.startsWith('#') &&
meta &&
/^https?:\/\//i.test(line)

){

channels.push({

...meta,

url:line

});

meta = null;

}

}

return channels;

}

async function loadWorld(){

const response =
await fetch(
WORLD_URL,
{
cache:'no-store'
}
);

if(!response.ok){

throw new Error(
'HTTP ' +
response.status
);

}

return parseM3U(
await response.text()
);

}

function unique(channels){

const seen =
new Set();

return channels.filter(
channel => {

const key =
(
channel.url ||
channel.id ||
channel.name
).toLowerCase();

if(
seen.has(key)
){

return false;

}

seen.add(key);

return true;

}
);

}

function channelKey(channel){

return (
channel.url ||
channel.id ||
channel.name
);

}

function isFavorite(channel){

return state.favorites.includes(
channelKey(channel)
);

}

function saveState(){

safeWrite(
'nexworld_v62_favorites',
state.favorites
);

safeWrite(
'nexworld_v62_history',
state.history
);

}

function toggleFavorite(channel){

const key =
channelKey(channel);

if(
isFavorite(channel)
){

state.favorites =
state.favorites.filter(
item =>
item !== key
);

toast(
'Retiré des favoris'
);

}else{

state.favorites = [
...state.favorites,
key
];

toast(
'Ajouté aux favoris'
);

}

saveState();

render();

}

function addHistory(channel){

const key =
channelKey(channel);

state.history = [

channel,

...state.history.filter(
item =>
channelKey(item) !== key
)

].slice(0,12);

saveState();

}

function filtered(){

let channels =
state.channels;

if(
state.country !== 'all'
){

channels =
channels.filter(
channel =>
channel.countryKey ===
state.country
);

}

if(
state.region !== 'all'
){

channels =
channels.filter(
channel =>
channel.region ===
state.region
);

}

const query =
state.search
.toLowerCase()
.trim();

if(query){

channels =
channels.filter(
channel =>
(
channel.name +
' ' +
channel.country +
' ' +
channel.group
)
.toLowerCase()
.includes(query)
);

}

return channels;

}

function makeCard(channel){

const card =
document.createElement(
'article'
);

card.className =
'card';

const favorite =
document.createElement(
'button'
);

favorite.className =
'fav' +
(
isFavorite(channel)
? ' on'
: ''
);

favorite.textContent =
isFavorite(channel)
? '♥'
: '♡';

favorite.onclick =
event => {

event.stopPropagation();

toggleFavorite(channel);

};

const image =
document.createElement(
'img'
);

image.className =
'channelLogo';

image.loading =
'lazy';

image.alt = '';

image.src =
channel.logo || '';

image.onerror =
() =>
image.style.visibility =
'hidden';

const name =
document.createElement(
'div'
);

name.className =
'channelName';

name.textContent =
channel.name;

const meta =
document.createElement(
'div'
);

meta.className =
'meta';

meta.textContent =
flag(channel.country) +
' ' +
channel.country;

card.append(
favorite,
image,
name,
meta
);

card.onclick =
() =>
openPlayer(channel);

return card;

}

function renderGrid(
id,
channels,
message
){

const grid =
$(id);

grid.textContent = '';

if(!channels.length){

const empty =
document.createElement(
'div'
);

empty.className =
'empty';

empty.textContent =
message;

grid.append(empty);

return;

}

const fragment =
document.createDocumentFragment();

channels.forEach(
channel =>
fragment.append(
makeCard(channel)
)
);

grid.append(fragment);

}

function renderCountries(){

const select =
$('country');

select.textContent = '';

const all =
document.createElement(
'option'
);

all.value =
'all';

all.textContent =
'🌍 Tous les pays';

select.append(all);

const countries =
new Map();

state.channels.forEach(
channel => {

if(
channel.country &&
!countries.has(
channel.countryKey
)
){

countries.set(
channel.countryKey,
channel.country
);

}

}
);

[
...countries.entries()
]
.sort(
(a,b) =>
a[1].localeCompare(
b[1],
'fr'
)
)
.forEach(
([key,name]) => {

const option =
document.createElement(
'option'
);

option.value =
key;

option.textContent =
flag(name) +
' ' +
name;

select.append(option);

}
);

const exists =
[
...select.options
]
.some(
option =>
option.value ===
state.country
);

select.value =
exists
? state.country
: 'all';

$('countryCount')
.textContent =
countries.size +
' pays';

}

function renderRegions(){

const box =
$('regions');

box.textContent = '';

const regions = [

['all','🌍 Monde'],
['africa','🌍 Afrique'],
['europe','🇪🇺 Europe'],
['americas','🌎 Amériques'],
['asia','🌏 Asie'],
['oceania','🌊 Océanie']

];

regions.forEach(
([key,label]) => {

const button =
document.createElement(
'button'
);

button.className =
'chip' +
(
state.region === key
? ' active'
: ''
);

button.textContent =
label;

button.onclick =
() => {

state.region =
key;

state.page =
1;

render();

};

box.append(button);

}
);

}

function render(){

renderCountries();

renderRegions();

const favorites =
state.channels.filter(
isFavorite
);

$('favSec').hidden =
!favorites.length;

renderGrid(
'favGrid',
favorites,
'Aucun favori.'
);

const history =
state.history;

$('histSec').hidden =
!history.length;

renderGrid(
'histGrid',
history,
'Aucun historique.'
);

const channels =
filtered();

const visible =
channels.slice(
0,
state.page *
PAGE_SIZE
);

$('count').textContent =
state.channels.length;

$('favCount').textContent =
state.favorites.length;

$('sourceCount').textContent =
state.channels.length
? '1'
: '0';

renderGrid(
'grid',
visible,
'Aucune chaîne trouvée.'
);

$('result').textContent =
visible.length +
' / ' +
channels.length;

if(
visible.length <
channels.length
){

$('more').hidden =
false;

$('more').textContent =
'Charger 48 autres';

}else{

$('more').hidden =
true;

}

}

async function start(){

if(state.loading)
return;

state.loading =
true;

status(
'Connexion...'
);

$('grid').innerHTML =
'<div class="empty">' +
'<span class="spin"></span> ' +
'Chargement du catalogue mondial…' +
'</div>';

try{

state.channels =
unique(
await loadWorld()
);

state.page =
1;

render();

status(
state.channels.length
? 'TV connectée'
: 'Aucune chaîne',
state.channels.length
? 'ok'
: 'err'
);

toast(
state.channels.length +
' chaînes disponibles'
);

}catch(error){

console.error(error);

state.channels = [];

render();

status(
'Erreur réseau',
'err'
);

toast(
'Impossible de charger le catalogue mondial'
);

}finally{

state.loading =
false;

}

}

function openPlayer(channel){

$('playerTitle')
.textContent =
channel.name +
' · ' +
channel.country;

const player =
$('player');

const video =
$('video');

player.classList.add(
'show'
);

video.src =
channel.url;

video.load();

addHistory(channel);

render();

const playPromise =
video.play();

if(
playPromise &&
playPromise.catch
){

playPromise.catch(
() =>
toast(
'Appuyez sur lecture si nécessaire'
)
);

}

}

function closePlayer(){

const video =
$('video');

video.pause();

video.removeAttribute(
'src'
);

video.load();

$('player')
.classList.remove(
'show'
);

}

$('search')
.addEventListener(
'input',
event => {

state.search =
event.target.value;

state.page =
1;

render();

}
);

$('country')
.addEventListener(
'change',
event => {

state.country =
event.target.value;

state.region =
'all';

state.page =
1;

render();

}
);

$('refresh')
.addEventListener(
'click',
start
);

$('more')
.addEventListener(
'click',
() => {

state.page++;

render();

}
);

$('close')
.addEventListener(
'click',
closePlayer
);

$('fullscreen')
.addEventListener(
'click',
async () => {

try{

const video =
$('video');

if(
video.requestFullscreen
){

await video.requestFullscreen();

}else if(
video.webkitEnterFullscreen
){

video.webkitEnterFullscreen();

}

}catch(error){

toast(
'Plein écran indisponible'
);

}

}
);

$('video')
.addEventListener(
'error',
() =>
toast(
'Flux indisponible ou non compatible'
)
);

document
.querySelectorAll(
'[data-nav]'
)
.forEach(
button => {

button.addEventListener(
'click',
() => {

document
.querySelectorAll(
'[data-nav]'
)
.forEach(
item =>
item.classList.remove(
'active'
)
);

button.classList.add(
'active'
);

const nav =
button.dataset.nav;

if(
nav === 'favorites'
){

$('favSec')
.scrollIntoView({
behavior:'smooth'
});

}else if(
nav === 'history'
){

$('histSec')
.scrollIntoView({
behavior:'smooth'
});

}else if(
nav === 'all'
){

$('grid')
.scrollIntoView({
behavior:'smooth'
});

}else{

window.scrollTo({
top:0,
behavior:'smooth'
});

}

}
);

}
);

function boot(){

state.favorites =
safeRead(
'nexworld_v62_favorites',
[]
);

state.history =
safeRead(
'nexworld_v62_history',
[]
);

render();

start();

}

window.addEventListener(
'error',
event =>
console.error(
'NEXWORLD error:',
event.error ||
event.message
)
);

window.addEventListener(
'unhandledrejection',
event =>
console.error(
'NEXWORLD promise:',
event.reason
)
);

if(
document.readyState ===
'loading'
){

document.addEventListener(
'DOMContentLoaded',
boot,
{once:true}
);

}else{

boot();

}
</script>

</body>
</html>
